name: Publish Kujenga Accomplish release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            package: package:win
            files: apps/desktop/release/*.exe,apps/desktop/release/*.blockmap,apps/desktop/release/latest.yml
          - name: macOS universal
            runner: macos-13
            package: package:mac:universal
            files: apps/desktop/release/*.dmg,apps/desktop/release/*.zip,apps/desktop/release/latest-mac.yml
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @accomplish/desktop run ${{ matrix.package }}
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CERTIFICATE && 'true' || 'false' }}
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ matrix.files }}
